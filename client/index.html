<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShopElite — Premium e-commerce platform with the best products at the best prices." />
    <meta name="theme-color" content="#7c3aed" />
    <title>ShopElite — Premium Shopping Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Emergency Debug Script -->
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.height = '100%';
        div.style.backgroundColor = '#1a1a2e';
        div.style.color = '#f43f5e';
        div.style.padding = '20px';
        div.style.fontFamily = 'monospace';
        div.style.zIndex = '99999';
        div.style.overflow = 'auto';
        div.innerHTML = '<h1>🚨 CRASH DETECTED</h1>' +
                        '<p><b>Error:</b> ' + msg + '</p>' +
                        '<p><b>File:</b> ' + url + '</p>' +
                        '<p><b>Line:</b> ' + line + '</p>' +
                        '<pre>' + (error ? error.stack : 'No stack trace') + '</pre>';
        document.body.appendChild(div);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
